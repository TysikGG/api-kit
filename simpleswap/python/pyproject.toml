[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simpleswap-client"
version = "0.2.0"
description = "Python client for the SimpleSwap cryptocurrency exchange API (v3): pairs, estimates, swaps, market rates, and deposit confirmation"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/TysikGG/api-kit"
Documentation = "https://simpleswap.io/en/affiliate-program/help-center/article/public-api-guide"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-httpx>=0.30",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simpleswap"]

[tool.pytest.ini_options]
markers = [
  "live: calls the real SimpleSwap API and needs SIMPLESWAP_API_KEY",
]
testpaths = ["tests"]
addopts = "--cov=simpleswap --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
