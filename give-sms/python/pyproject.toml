[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "give-sms"
version = "0.2.0"
description = "Python client for the Give-SMS virtual number, rental, and SMS activation API"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/TysikGG/api-kit"
Documentation = "https://give-sms.com/api.html"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "pytest-httpx>=0.30",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/give_sms"]

[tool.pytest.ini_options]
markers = [
  "live: calls the real Give-SMS API and needs GIVE_SMS_API_KEY",
]
testpaths = ["tests"]
addopts = "--cov=give_sms --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["give_sms"]
branch = false

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
