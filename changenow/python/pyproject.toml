[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "changenow-client"
version = "0.2.0"
description = "Python client for ChangeNOW: partner API v2, legacy v1, anonymous catalogue and v3 quotes, polling, and retries"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/TysikGG/api-kit"
Documentation = "https://documenter.getpostman.com/view/8180765/SVfTPnM8"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-httpx>=0.30",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/changenow"]

[tool.pytest.ini_options]
markers = [
  "live: calls the real ChangeNOW API and needs CHANGENOW_API_KEY",
]
testpaths = ["tests"]
addopts = "--cov=changenow --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
