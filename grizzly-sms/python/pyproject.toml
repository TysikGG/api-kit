[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grizzly-sms-client"
version = "0.2.0"
description = "Python client for the Grizzly SMS activation and partner push API"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/TysikGG/api-kit"
Documentation = "https://grizzlysms.com/docs"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-httpx>=0.30",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grizzly_sms"]

[tool.pytest.ini_options]
markers = [
  "live: calls the real Grizzly SMS API and needs GRIZZLY_API_KEY",
]
testpaths = ["tests"]
addopts = "--cov=grizzly_sms --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
