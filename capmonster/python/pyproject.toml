[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capmonster-client"
version = "0.1.0"
description = "Python client for the CapMonster Cloud captcha recognition API: sync and async, every documented task type, balance, user-agent, and incorrect-solution reports"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/TysikGG/api-kit"
Documentation = "https://docs.capmonster.cloud"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "pytest-httpx>=0.30",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capmonster"]

[tool.pytest.ini_options]
markers = [
  "live: calls the real CapMonster Cloud API and needs CAPMONSTER_API_KEY",
]
testpaths = ["tests"]
addopts = "--cov=capmonster --cov-report=term-missing --cov-fail-under=95"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/capmonster"]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
