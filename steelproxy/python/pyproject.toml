# Publish trigger
# Steel Proxy API client
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steelproxy"
version = "0.1.0"
description = "Python client for the Steel Proxy Reseller and Franchise API"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/TysikGG/api-kit"
Documentation = "https://api.steelproxy.com/docs"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-httpx>=0.30",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/steelproxy"]

[tool.pytest.ini_options]
markers = [
  "live: calls the real Steel Proxy API and needs STEELPROXY_API_KEY",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
