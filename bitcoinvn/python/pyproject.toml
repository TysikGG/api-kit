[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitcoinvn"
version = "0.2.0"
description = "Python client for the BitcoinVN exchange API"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/TysikGG/api-kit"
Documentation = "https://bitcoinvn.io/api/doc.json"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-httpx>=0.30",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bitcoinvn"]

[tool.pytest.ini_options]
markers = [
  "live: calls the real BitcoinVN API and needs BITCOINVN_API_KEY",
]
testpaths = ["tests"]
addopts = "--cov=bitcoinvn --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["bitcoinvn"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
