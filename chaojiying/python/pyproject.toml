[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaojiying"
version = "0.1.0"
description = "Python client for the Chaojiying (超级鹰) CAPTCHA recognition API"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/TysikGG/api-kit"
Documentation = "https://www.chaojiying.com/api-5.html"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-httpx>=0.30",
  "ruff>=0.8",
  "pydoc-markdown>=4.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chaojiying"]

[tool.pytest.ini_options]
markers = [
  "live: calls the real Chaojiying API and needs CHAOJIYING_USER and CHAOJIYING_PASS",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
