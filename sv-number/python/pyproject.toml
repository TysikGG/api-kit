[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sv-number"
version = "0.2.0"
description = "Python client for the SV Number SMS verification API"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/TysikGG/api-kit"
Documentation = "https://sms-verification-number.com/en/api-sms-activate/"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-httpx>=0.30",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sv_number"]

[tool.pytest.ini_options]
markers = [
  "live: calls the real SV Number API and needs SV_NUMBER_API_KEY",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
