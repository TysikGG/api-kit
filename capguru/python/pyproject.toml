[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capguru-client"
version = "0.1.0"
description = "Python client for the CapGuru solving API"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/TysikGG/api-kit"
Documentation = "https://cap.guru/api-docs/"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6",
  "pytest-httpx>=0.30",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/capguru"]

[tool.pytest.ini_options]
markers = [
  "live: calls the real CapGuru API and requires CAPGURU_API_KEY",
]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=capguru --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["capguru"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
