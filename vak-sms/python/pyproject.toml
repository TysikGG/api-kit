[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaksms-client"
version = "0.2.0"
description = "Python client for the VAK-SMS virtual number and SMS activation API"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/TysikGG/api-kit"
Documentation = "https://vak-sms.com/en/api/"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-httpx>=0.30",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vak_sms"]

[tool.pytest.ini_options]
markers = [
  "live: calls the real VAK-SMS API and needs VAK_SMS_API_KEY",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
