name: Publish to npm and PyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      npm: ${{ steps.changes.outputs.npm }}
      pypi: ${{ steps.changes.outputs.pypi }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          event = os.environ["EVENT_NAME"]
          before = os.environ.get("BEFORE_SHA", "")
          sha = os.environ["HEAD_SHA"]
          zero = "0" * 40

          def commit_exists(rev: str) -> bool:
              if not rev or rev == zero:
                  return False
              return subprocess.run(
                  ["git", "cat-file", "-e", f"{rev}^{{commit}}"],
                  capture_output=True,
              ).returncode == 0

          def files_from_history(rev: str) -> list[str]:
              commits = subprocess.check_output(
                  ["git", "rev-list", rev], text=True
              ).splitlines()
              names: list[str] = []
              for commit in commits:
                  names.extend(
                      subprocess.check_output(
                          [
                              "git",
                              "diff-tree",
                              "--no-commit-id",
                              "--name-only",
                              "-r",
                              "--root",
                              commit,
                          ],
                          text=True,
                      ).splitlines()
                  )
              return names

          if event == "workflow_dispatch":
              files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          elif commit_exists(before):
              files = subprocess.check_output(
                  ["git", "diff", "--name-only", before, sha], text=True
              ).splitlines()
          else:
              print(f"Previous commit {before or '(empty)'} is not in this clone.")
              files = files_from_history(sha)

          npm = set()
          pypi = set()
          for file in files:
              parts = file.split("/")
              if len(parts) < 3:
                  continue
              service, lang = parts[0], parts[1]
              if lang == "js" and os.path.isfile(f"{service}/js/package.json"):
                  npm.add(f"{service}/js")
              elif lang == "python" and os.path.isfile(f"{service}/python/pyproject.toml"):
                  pypi.add(f"{service}/python")

          npm_json = json.dumps(sorted(npm))
          pypi_json = json.dumps(sorted(pypi))
          print(f"npm packages: {npm_json}")
          print(f"pypi packages: {pypi_json}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"npm={npm_json}\n")
              fh.write(f"pypi={pypi_json}\n")
          PY

  publish-npm:
    needs: detect
    if: needs.detect.outputs.npm != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.npm) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run verification tests
        run: npm test

      - name: Build library
        run: npm run build

      - name: Publish to npm if version bumped
        run: |
          set -eu
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          # registry.npmjs.org expects scoped names as @scope%2Fname
          ENCODED_NAME=$(node -p "encodeURIComponent(require('./package.json').name).replace(/%40/g, '@')")
          REGISTRY_URL="https://registry.npmjs.org/${ENCODED_NAME}/${CURRENT_VERSION}"
          CODE=$(curl -sS -o /tmp/npm-version.json -w "%{http_code}" "$REGISTRY_URL" || echo "000")
          echo "Local version: $CURRENT_VERSION"
          echo "npm registry HTTP status for ${NAME}@${CURRENT_VERSION}: $CODE"

          if [ "$CODE" = "200" ]; then
            echo "Version $CURRENT_VERSION is already published on npm. Skipping publish."
            exit 0
          fi

          # Fallback: npm view can succeed when the CDN JSON briefly 404s
          if NPM_VERSION=$(npm view "$NAME@$CURRENT_VERSION" version 2>/dev/null); then
            if [ "$NPM_VERSION" = "$CURRENT_VERSION" ]; then
              echo "Version $CURRENT_VERSION is already published on npm (npm view). Skipping publish."
              exit 0
            fi
          fi

          echo "Publishing version $CURRENT_VERSION to npm..."
          set +e
          npm publish --access public > /tmp/npm-publish.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/npm-publish.log || true
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          if grep -Eqi "cannot publish over the previously published versions|EPUBLISHCONFLICT|previously published" /tmp/npm-publish.log; then
            echo "Version $CURRENT_VERSION was already published on npm during publish. Treating as success."
            exit 0
          fi
          exit "$STATUS"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: detect
    if: needs.detect.outputs.pypi != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.pypi) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Run verification tests
        run: uv run --frozen --group dev pytest -m "not live"

      - name: Build package
        run: uv build

      - name: Publish to PyPI if version bumped
        run: |
          set -eu
          CURRENT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          # Normalize for the JSON API (PyPI treats _ and - as equivalent in URLs)
          API_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'].replace('_','-'))")
          CODE=$(curl -sS -o /tmp/pypi-version.json -w "%{http_code}" "https://pypi.org/pypi/${API_NAME}/${CURRENT_VERSION}/json" || echo "000")
          echo "Local version: $CURRENT_VERSION"
          echo "PyPI HTTP status for ${NAME}==${CURRENT_VERSION}: $CODE"

          if [ "$CODE" = "200" ]; then
            echo "Version $CURRENT_VERSION is already published on PyPI. Skipping publish."
            exit 0
          fi

          echo "Publishing version $CURRENT_VERSION to PyPI..."
          if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
            unset UV_PUBLISH_TOKEN
          fi
          set +e
          uv publish > /tmp/pypi-publish.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/pypi-publish.log || true
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          if grep -Eqi "File already exists|already exists on the index|previously uploaded" /tmp/pypi-publish.log; then
            echo "Version $CURRENT_VERSION was already published on PyPI during publish. Treating as success."
            exit 0
          fi
          exit "$STATUS"
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
