[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peak-client"
version = "0.1.0"
description = "Python client for the Peak CAPTCHA solving API (Turnstile, Cloudflare 5s, and AWS WAF)"
readme = "README.md"
requires-python = ">=3.10"
license = "ISC"
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/TysikGG/api-kit"
Documentation = "https://peak.fo/docs"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "pytest-httpx>=0.30",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/peak"]

[tool.pytest.ini_options]
markers = [
  "live: calls the real Peak API and needs PEAK_API_KEY",
]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=peak --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
